<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<link rel="canonical" href="{{ request.base_url }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b0b12'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%23ff4fa3' font-family='sans-serif' font-weight='700'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/portfolio.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site-extras.css') }}">
{% block head_extra %}{% endblock %}
</head>

<body>
<div class="glow one"></div>
<div class="glow two"></div>

<header>
  <nav class="container">
    <a href="{{ url_for('public.home') }}" class="logo">ZUBAIR<span>.</span></a>
    <div class="nav-links" id="navLinks">
      <a href="{{ url_for('public.home') }}">Home</a>
      <a href="{{ url_for('public.home') }}#work">My Work</a>
      <a href="{{ url_for('public.home') }}#about">About</a>
      <a href="{{ url_for('public.home') }}#services">Services</a>
      <a href="{{ url_for('public.home') }}#contact">Contact</a>
      <a href="{{ url_for('dashboard.overview') }}" class="admin-btn">Admin</a>
    </div>
    <a class="btn btn-primary nav-cta" href="{{ url_for('public.home') }}#contact">Let's Talk ↗</a>
    <button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
  </nav>
</header>

{% block content %}{% endblock %}

<footer>
  <div class="container footer-inner">
    <div>© <span id="year"></span> Zubair Ahmad. Built with curiosity and code.</div>
    <a class="back-top" href="#home">Back to top ↑</a>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/portfolio.js') }}"></script>
<script src="{{ url_for('static', filename='js/track.js') }}" defer></script>
{% block scripts_extra %}{% endblock %}
</body>
</html>
