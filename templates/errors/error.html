{% extends "base.html" %}
{% block title %}{{ code }} | {{ site.name }}{% endblock %}
{% block description %}{{ title }}{% endblock %}
{% block content %}
<main>
<section class="container error-page" id="home">
  <div class="eyebrow">Error {{ code }}</div>
  <h1 class="section-title">{{ title }}</h1>
  <p class="section-desc">{{ message }}</p>
  <div class="hero-actions" style="margin-top:28px;">
    <a href="{{ url_for('public.home') }}" class="btn btn-primary">Back to the portfolio</a>
  </div>
</section>
</main>
{% endblock %}
